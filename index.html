<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="column1">
            <div class="choice" id="rock">
                <img src="rock.jpeg">
            </div>
            <div class="choice" id="paper">
                <img src="paper.jpeg">
            </div>
            <div class="choice" id="scissors">
                <img src="scissors.jpeg">
            </div>
        </div>
        <div class="column2">
            <div class="comp-choice" id="rock1">
                <img src="rock.jpeg">
            </div>
            <div class="comp-choice" id="paper1">
                <img src="paper.jpeg">
            </div>
            <div class="comp-choice" id="scissors1">
                <img src="scissors.jpeg">
            </div>
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>
    <div class="win-msg"></div>
    <button class="new hide">New Game</button>
    <script src="app.js"></script>
</body>
</html>
